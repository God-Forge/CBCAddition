# 构建配置
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false
org.gradle.parallel=true
org.gradle.caching=true

# 注意：本工程必须使用 Java 17 构建。
# 由于整合包路径含中文，不建议在此写 org.gradle.java.home（会乱码），
# 请在命令行设置 JAVA_HOME，或在 IDEA 的 Gradle 设置中选择 17 号 JDK。

# 环境
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.20
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# JEI（仅编译期依赖，不随模组分发）
jei_version=15.20.0.129

# Mod 信息
mod_id=cbcaddition
mod_name=CBCAddition
mod_license=GPL-3.0-only
mod_version=0.2.0
mod_group_id=com.neolxsky.CBCAddition
mod_authors=neolxsky
mod_description=CBCAddition - a private addon for Create: The Brass Concerto, streamlining material crafting.
