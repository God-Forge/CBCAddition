modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# ---- 可选依赖：Create（黄铜协奏曲的核心）----
# 不强制要求，方便单独测试；存在时可使用 Create 的 API。
[[dependencies.${mod_id}]]
modId = "create"
mandatory = false
versionRange = "[0.5.1,)"
ordering = "AFTER"
side = "BOTH"
